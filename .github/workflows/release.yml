# Build and publish a release when a version tag is pushed.
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# The tag is the trigger, the .toc is the source of truth for the version, and
# this fails loudly if the two disagree -- which is the rule this project has
# had since the probe once shipped announcing 0.4 with 0.3 in its .toc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the .toc, and check it against the tag
        id: version
        run: |
          toc_version=$(sed -n 's/^## Version:[[:space:]]*//p' VanillaQuesting/VanillaQuesting.toc | tr -d '\r')
          tag_version="${GITHUB_REF_NAME#v}"
          echo "toc=$toc_version" >> "$GITHUB_OUTPUT"
          if [ "$toc_version" != "$tag_version" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but VanillaQuesting.toc says $toc_version."
            echo "::error::The .toc is the single source of truth. Fix it and re-tag."
            exit 1
          fi

      - name: Run the test suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          cd dev/tests && ./run.sh

      - name: Build the AddOn zip
        id: package
        run: |
          name="VanillaQuesting-${{ steps.version.outputs.toc }}.zip"
          # A top-level VanillaQuesting/ folder, so it extracts straight into
          # Interface\AddOns\. Nothing from dev/ or the docs goes in it.
          zip -qr "$name" VanillaQuesting
          unzip -l "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Take this version's section out of the CHANGELOG
        run: |
          awk -v v="## ${{ steps.version.outputs.toc }}" '
            $0 == v { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "::warning::No '## ${{ steps.version.outputs.toc }}' section in CHANGELOG.md."
            echo "See CHANGELOG.md." > body.md
          fi
          cat .github/release-footer.md >> body.md
          cat body.md

      - name: Publish, or fill in a release that already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both routes to a release end up here, and neither should fail
          # because the other got there first:
          #
          #   * push a tag           -> this job creates the release;
          #   * "Draft a new release" on GitHub, which makes the tag itself
          #                          -> the release exists before this runs.
          #
          # So create it if it is not there, and otherwise fill in what the
          # web form cannot: the built zip, and the notes from CHANGELOG.md.
          name="${{ steps.package.outputs.name }}"
          title="Vanilla Questing ${{ steps.version.outputs.toc }}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; updating it."

            # Notes written by hand on the web form are not overwritten. Only
            # an empty body gets filled in, so the author always wins.
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body')
            if [ -z "$body" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file body.md
            else
              echo "It already has notes. Leaving them alone."
              gh release edit "$GITHUB_REF_NAME" --title "$title"
            fi

            # --clobber so a re-run replaces the asset rather than erroring.
            gh release upload "$GITHUB_REF_NAME" "$name" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file body.md \
              "$name"
          fi
